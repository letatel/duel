services:
  backend:
    build: ./backend
    restart: unless-stopped
    networks: [duel]

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Override via a repo-root .env (gitignored) for a host serving a
      # different domain set -- see .env.example.
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-letatel.com dicefight.online}
      NGINX_CERT_NAME: ${NGINX_CERT_NAME:-letatel.com}
    volumes:
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks: [duel]

  # Not run continuously -- invoked on demand for the initial certificate
  # (`docker compose run --rm certbot certonly ...`) and for renewal (see
  # /etc/cron.d/duel-certbot on the host).
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    networks: [duel]

networks:
  duel:

volumes:
  certbot-www:
  certbot-conf:
