# Local-only, no-TLS equivalent of full.conf, for testing the full
# nginx+backend+built-frontend stack in Docker on a plain
# http://localhost -- mounted over /etc/nginx/conf.d/default.conf by
# docker-compose.override.yml, bypassing entrypoint.sh's cert-presence
# check entirely (there's no real domain/cert here). Not part of the
# production image; do not COPY this into the Dockerfile.
server {
    listen 80;
    server_name _;

    location = / {
        return 301 /duel/;
    }

    location = /duel {
        return 301 /duel/;
    }

    location ~ ^/duel/ws/ {
        rewrite ^/duel(/ws/.*)$ $1 break;
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /duel/ {
        alias /usr/share/nginx/html/duel/;
        try_files $uri $uri/ /duel/index.html;
    }
}
