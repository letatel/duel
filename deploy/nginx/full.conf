# Swapped in by entrypoint.sh once a certificate exists. Port 80 only
# redirects to 443 (and keeps serving ACME challenges for certificate
# renewal/expansion).
server {
    listen 80;
    server_name letatel.com dicefight.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name letatel.com dicefight.online;

    ssl_certificate /etc/letsencrypt/live/letatel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letatel.com/privkey.pem;

    location = / {
        return 301 /duel/;
    }

    # /duel (no trailing slash) doesn't match `location /duel/` below --
    # nginx needs an explicit exact-match redirect to add the slash back.
    location = /duel {
        return 301 /duel/;
    }

    # Matches both /duel/ws/game (hot-seat/vs-AI) and /duel/ws/room/{id}
    # (shared multiplayer rooms) -- both live on the same backend process,
    # just different endpoints.
    location ~ ^/duel/ws/ {
        rewrite ^/duel(/ws/.*)$ $1 break;
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /duel/ {
        alias /usr/share/nginx/html/duel/;
        try_files $uri $uri/ /duel/index.html;
    }
}
