# Swapped in by entrypoint.sh once a certificate exists. Port 443 is taken
# by an unrelated VPN service on this host, so TLS is served on 8443
# instead; port 80 only redirects there (and keeps serving ACME challenges
# for certificate renewal).
server {
    listen 80;
    server_name letatel.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl;
    server_name letatel.com;

    ssl_certificate /etc/letsencrypt/live/letatel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/letatel.com/privkey.pem;

    location = / {
        return 301 /duel/;
    }

    location /duel/ws/game {
        proxy_pass http://backend:8010/ws/game;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /duel/ {
        alias /usr/share/nginx/html/duel/;
        try_files $uri $uri/ /duel/index.html;
    }
}
